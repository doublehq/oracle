[tool.poetry]
name = "oracle"
version = "0.1.0"
description = "Tax-aware portfolio optimization engine from Double Finance"
authors = ["JJ Maxwell <jmaxwell@double.finance>"]
readme = "README.md"
license = "MIT"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
pandas = ">=2.0,<4"
pulp = ">=2.7,<4"
numpy = ">=1.24,<3"
mcp = ">=2.0,<3"
openpyxl = ">=3.1,<4"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"
pytest-asyncio = ">=0.23,<2"

[tool.poetry.scripts]
oracle-mcp = "src.mcp_server.server:main"
oracle-rh-login = "src.mcp_server.rh_login:main"
oracle-rh-snapshot = "src.mcp_server.snapshot:main"

[tool.pytest.ini_options]
addopts = '-m "not integration"'
markers = [
    "integration: tests that require external network services",
]
filterwarnings = [
    "ignore:Constructing LpVariable.*:DeprecationWarning",
    "ignore:Using LpProblem.constraints.*:DeprecationWarning",
    "ignore:It is deprecated to return a value.*:DeprecationWarning",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
